name: 버그 리포트
description: 동작이 기대와 다를 때
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 기대했고 실제로는 어땠는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 화면 폭 900px에서 페이지를 연다
        2. 햄버거 버튼을 누른다
        3. 패널이 열리지 않는다
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 환경
      description: 브라우저와 화면 폭. 모바일이면 기기 이름도 적어주세요.
      placeholder: Chrome 130 / 390px / iPhone 15

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷이나 콘솔 로그
      description: 있으면 붙여주세요. 없으면 비워도 됩니다.
